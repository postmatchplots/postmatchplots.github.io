name: Update feed, sitemap and homepage

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/update_site.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild feed.xml, sitemap.xml and the homepage post list
        run: python scripts/update_site.py
      - name: Save changes back to the repository
        run: |
          if git diff --quiet; then
            echo "Nothing to update"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add feed.xml sitemap.xml index.html
            git commit -m "Update feed, sitemap and homepage post list"
            git push
          fi
